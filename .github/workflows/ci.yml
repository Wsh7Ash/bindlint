name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v
      - name: CLI smoke
        run: |
          go build ./cmd/bindlint
          ./bindlint lint testdata/clean.zone
          ./bindlint lint testdata/broken.zone --fail-on warning || test $? -eq 1
          ./bindlint rules
